<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const locale = localStorage.getItem('vanta-locale') === 'en' ? 'en' : 'ar';
        document.documentElement.lang = locale;
        document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.dataset.theme = localStorage.getItem('mabda-theme') === 'dark' ? 'dark' : 'light';
      } catch { /* Arabic remains the default if storage is unavailable. */ }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F1E8" />
    <link rel="icon" type="image/png" href="/brand/mabda/mark-crop.png" />
    <meta name="description" content="مبدأ من VANTA — دروس HTML وممارسة برمجية للمبتدئين." />
    <title>مبدأ — تعلّم البرمجة بالممارسة</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
